<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apply - Webexe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Karla:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<a class="brand" href="index.html"><img class="logo" src="logo.png" alt="Webexe"></a>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About us</a>
<a href="trainees.html">Our trainees</a>
<a href="jobs.html">Jobs</a>
<a href="apply.html" aria-current="page">Apply</a>
<a href="courses.html">Courses</a>
</nav>
</header>
<hr>

<main>
<h1>Apply online</h1>
<form id="f" novalidate>
<p>Name:<br><input type="text" id="n"></p>
<p>Email:<br><input type="email" id="e"></p>
<p>Job:<br><select id="j"><option value="">Choose a job</option><option>Junior Web Developer</option><option>Front-End Trainee</option><option>Full-Stack Trainee</option></select></p>
<p>Qualification:<br><input type="text" id="q"></p>
<p>Why do you want to work here?<br><textarea id="c" rows="4" cols="40"></textarea></p>
<p id="msg" role="alert"></p>
<button type="submit">Send application</button>
</form>
</main>

<hr>
<footer><p><small>Webexe, careers@webexe.example</small></p></footer>

<script>
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var m=document.getElementById('msg'),n=document.getElementById('n').value.trim();
  if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(document.getElementById('e').value)||!document.getElementById('j').value){
    m.textContent='Please enter your name, a valid email and choose a job.';return}
  m.textContent='Thank you, '+n+'. Your application has been received.';
  this.reset();
});
</script>
</body>
</html>
